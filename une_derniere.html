<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un dernier rendez-vous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-deep:#2a0f26;
    --wine:#4a1942;
    --gold:#d4a24c;
    --amber:#f2b705;
    --cream:#f5e6d3;
    --rose:#d98a7a;
    --ink:#f5e6d3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Jost', sans-serif;
    background: radial-gradient(ellipse at 50% 100%, var(--wine) 0%, var(--wine-deep) 55%, #14060f 100%);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    position:relative;
  }

  .glow{
    position:fixed;
    left:50%;
    bottom:-10%;
    width:60vw;
    max-width:600px;
    height:400px;
    background: radial-gradient(circle, rgba(242,183,5,0.18) 0%, transparent 70%);
    transform:translateX(-50%);
    z-index:0;
    pointer-events:none;
  }

  .sparks{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .spark{
    position:absolute;
    width:2px;height:2px;
    background:var(--gold);
    border-radius:50%;
    opacity:0.4;
    animation: flicker 2.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:0.12;}
    50%{opacity:0.7;}
  }

  .card{
    position:relative;
    z-index:2;
    max-width:520px;
    width:100%;
    background: linear-gradient(180deg, rgba(255,246,230,0.06) 0%, rgba(255,246,230,0.03) 100%);
    border:1px solid rgba(212,162,76,0.25);
    border-radius:4px;
    padding:56px 46px 46px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    text-align:center;
    overflow:hidden;
    backdrop-filter: blur(6px);
  }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:500;
    margin-bottom:22px;
  }

  h1{
    font-family:'Italiana', serif;
    font-weight:400;
    font-size:clamp(30px, 6.5vw, 44px);
    color:var(--ink);
    line-height:1.25;
    margin:0 0 22px;
    letter-spacing:0.01em;
  }

  h1 .name{
    color:var(--gold);
    font-style:normal;
  }

  p.lead{
    font-size:16px;
    color:rgba(245,230,211,0.75);
    line-height:1.7;
    margin:0 0 34px;
    font-weight:300;
  }

  .scene{
    position:relative;
    height:96px;
    margin:0 0 34px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .candle{
    position:relative;
    width:14px;
    height:52px;
    background: linear-gradient(180deg, #f0e2c8 0%, #e3d3ad 100%);
    border-radius:3px 3px 1px 1px;
  }
  .flame{
    position:absolute;
    top:-22px;
    left:50%;
    transform:translateX(-50%);
    width:14px;
    height:22px;
    background: radial-gradient(ellipse at 50% 70%, var(--amber) 0%, var(--rose) 60%, transparent 100%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: dance 2.4s ease-in-out infinite;
    filter: blur(0.3px);
  }
  @keyframes dance{
    0%,100%{ transform:translateX(-50%) rotate(-3deg) scaleY(1); }
    50%{ transform:translateX(-48%) rotate(3deg) scaleY(1.08); }
  }

  .details{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin:0 0 36px;
    padding:22px 24px;
    background: rgba(0,0,0,0.18);
    border-radius:4px;
    border:1px solid rgba(212,162,76,0.18);
  }
  .detail-row{
    display:flex;
    align-items:baseline;
    gap:12px;
    font-size:14.5px;
    color:var(--ink);
    text-align:left;
  }
  .detail-row .label{
    font-weight:500;
    min-width:78px;
    color:var(--gold);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    font-family:'Jost', sans-serif;
  }

  .btn-row{
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
  }

  button{
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:0.03em;
    padding:14px 28px;
    border-radius:2px;
    border:none;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .btn-yes{
    background: var(--gold);
    color: var(--wine-deep);
    box-shadow: 0 8px 24px rgba(212,162,76,0.3);
  }
  .btn-yes:hover{ transform:translateY(-2px); background:#e0b25f; }
  .btn-no{
    background: transparent;
    color: var(--ink);
    border: 1px solid rgba(245,230,211,0.3);
  }
  .btn-no:hover{ background: rgba(245,230,211,0.08); }

  .response{
    margin-top:24px;
    font-family:'Italiana', serif;
    font-size:19px;
    color:var(--gold);
    min-height:26px;
    opacity:0;
    transform:translateY(6px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .response.show{
    opacity:1;
    transform:translateY(0);
  }

  .already{
    display:none;
    margin-top:18px;
    font-size:12.5px;
    color:rgba(245,230,211,0.5);
    font-family:'Jost', sans-serif;
    letter-spacing:0.02em;
  }

  .confetti{
    position:fixed;
    top:-10px;
    width:7px;height:7px;
    border-radius:1px;
    z-index:5;
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .flame{ animation:none; }
    .spark{ animation:none; opacity:0.4; }
  }
</style>
</head>
<body>

<div class="sparks" id="sparks"></div>
<div class="glow"></div>

<div class="card" id="askCard">
  <div class="eyebrow">Avant de partir</div>
  <h1>Une dernière fois, <span class="name">Norie-Lyne</span>, avant que je m'en aille ?</h1>
  <p class="lead">Rien de compliqué. Juste toi, moi, et une soirée à Lille, une dernière fois avant mon départ.</p>

  <div class="scene">
    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>

  <div class="details">
    <div class="detail-row"><span class="label">Quoi</span><span>Ce que tu veux, sans prise de tête</span></div>
    <div class="detail-row"><span class="label">Quand</span><span>Un soir, avant mon départ</span></div>
    <div class="detail-row"><span class="label">Pourquoi</span><span>Parce que j'en ai simplement envie</span></div>
  </div>

  <div class="btn-row" id="btnRow">
    <button class="btn-yes" onclick="respond(true)">Oui, avec plaisir</button>
    <button class="btn-no" onclick="respond(false)">Une autre fois peut-être</button>
  </div>

  <div class="response" id="response"></div>
  <div class="already" id="already"></div>
</div>

<script>
  const STORAGE_KEY = 'dernier-tour-reponse';
  // Canal ntfy.sh privé. Change-le pour un nom unique et difficile à deviner si tu veux plus de discrétion.
  const NTFY_TOPIC = 'dernier-tour-norielyne-8k2q';

  const sparksContainer = document.getElementById('sparks');
  for(let i=0;i<50;i++){
    const s = document.createElement('div');
    s.className='spark';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*60+'%';
    s.style.animationDelay = (Math.random()*2.6)+'s';
    sparksContainer.appendChild(s);
  }

  async function respond(yes){
    const el = document.getElementById('response');
    if(yes){
      el.textContent = "Parfait, je m'occupe du reste.";
      launchConfetti();
    } else {
      el.textContent = "Pas de souci, à un de ces jours peut-être.";
    }
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');

    document.getElementById('btnRow').style.display = 'none';

    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      answer: yes ? 'oui' : 'non',
      date: new Date().toISOString()
    }));

    try{
      await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
        method: 'POST',
        body: yes ? 'Norie-Lyne a répondu oui.' : 'Norie-Lyne a répondu non.'
      });
    }catch(e){
      console.error('Notification error:', e);
    }
  }

  function checkExistingResponse(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      const el = document.getElementById('already');
      const d = new Date(data.date);
      const formatted = d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'});
      el.style.display = 'block';
      el.textContent = data.answer === 'oui'
        ? `Réponse enregistrée : oui, le ${formatted}`
        : `Réponse enregistrée : non, le ${formatted}`;

      document.getElementById('btnRow').style.display = 'none';
      const respEl = document.getElementById('response');
      respEl.textContent = data.answer === 'oui'
        ? "Elle a dit oui."
        : "Elle a décliné.";
      respEl.classList.add('show');
    }
  }

  checkExistingResponse();

  function launchConfetti(){
    const colors = ['#d4a24c','#f2b705','#d98a7a','#f5e6d3'];
    for(let i=0;i<40;i++){
      const c = document.createElement('div');
      c.className='confetti';
      c.style.left = Math.random()*100+'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animation = `fall ${2+Math.random()*1.5}s linear forwards`;
      c.style.animationDelay = (Math.random()*0.4)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 4000);
    }
  }

  const styleSheet = document.createElement('style');
  styleSheet.textContent = `
    @keyframes fall{
      to{ transform: translateY(105vh) rotate(360deg); opacity:0.9; }
    }
  `;
  document.head.appendChild(styleSheet);
</script>

</body>
</html>
